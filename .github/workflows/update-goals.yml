name: Update goals

on:
  schedule:
    # 03:15 UTC daily — after any evening kick-off has finished.
    - cron: "15 3 * * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write      # needed so the job can commit the new goals.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the latest goal counts
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update-goals.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "race-to-15 bot"
          git config user.email "actions@github.com"
          git add goals.json
          git diff --staged --quiet || git commit -m "Goals updated $(date -u +'%d %b %H:%M')"
          git push
